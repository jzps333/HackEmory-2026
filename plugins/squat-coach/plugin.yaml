id: squat-coach
name: "Squat coach"
summary: "Watches your squats on FaceTime, calls out form cues, then texts you an analysis and keeps your history."
author: toolstone
version: 2
kind: live
runs_on: server
triggers:
  phrases: ["coach my squats", "squat coach", "check my form"]
  qr: false
tools: [camera, speak, screen, memory]
permissions: "This plugin watches your camera while you squat, shows form cues on the video, and saves a short summary of each session to your history. Video isn't saved."
instructions: "Ask the caller to prop the phone up so their whole body is in view, side-on if possible. Watch them squat. After each rep give one short cue: depth (hips to knee height), knees out over toes, chest up, or slow down. Call coach_cue with the same short cue so it shows on screen. Be encouraging. Don't claim exact rep counts or measurements; you only see about one frame per second. When they say they're done (or before saying goodbye), call finish_session with a two-sentence analysis of the session: the main thing to work on and one thing that went well. You can call recall to compare with their past sessions."
